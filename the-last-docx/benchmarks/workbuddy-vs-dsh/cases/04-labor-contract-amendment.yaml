case_id: docx-labor-contract-amendment-v1
format: docx
mode: comparison
source_artifact: benchmarks/workbuddy-vs-dsh/fixtures/case-04-synthetic-labor-contract.docx
initial_content: >-
  虚构的 8 页固定期限劳动合同，含 12 条正文、3 个附件、薪酬表、岗位/地点表、交接清单和签署页。含真实 Word 批注、脚注、外部及内部超链接、书签、页码字段、重复表头和修订设置。合同正文与附件故意重复关键字段；另有与工资金额相同但性质不同的年度奖金及培训预算，也有与试用期长度相似但含义不同的培养回顾安排。
primary_prompt: |-
  请根据以下已批准信息，对这份劳动合同做局部修订，另存为新的 DOCX，不要覆盖源文件。仅修改明确列出的字段和句子；不要重写整份合同，也不要自行补充法律结论或其他合同约定。

  1. 合同期限：将正文第 2.1 条的起始日改为 2026 年 11 月 1 日，终止日改为 2029 年 10 月 31 日。将第 2.2 条试用期改为三个月，期间为 2026 年 11 月 1 日至 2027 年 1 月 31 日。同步更新附件中明确复述这些合同期限或试用期的字段（若有）。不要改附件 B.2.1 的“三个月培养回顾”——它是培训安排，不是试用期。

  2. 岗位与部门：将正文第 3.1 条岗位“高级运维分析师”改为“数据运营专员”，部门“云平台组”改为“数据治理组”；同步更新附件 B 中对应的岗位和部门字段。不要改职责、职级、汇报对象或培训安排。

  3. 工作地点：将正文第 4.1 条及附件 B“常规办公地点”统一改为“上海市浦东新区龙井路 88 号海悦中心 5 层”。不要改甲方注册地址、附件 B 中的临时应急集合点（它使用旧地址但用途不同）、设备交接地点或设备编号。

  4. 薪酬：将正文第 6.1 条转正后税前月基本工资由人民币 18,800 元改为人民币 20,800 元，并把中文大写同步改为“贰万零捌佰元整”。按第 6.2 条已约定的 80% 比例，将试用期税前月工资改为人民币 16,640 元。同步更新附件 A 中对应的转正后月基本工资和试用期月工资，并保持正文与附件一致。不要改每月 800 元交通津贴、年度目标奖金参考额人民币 18,800 元或年度培训预算参考上限人民币 18,800 元；它们不是基本工资。

  5. 新增信息安全约定：在正文第 9.2 条之后紧接着新增一句：“因故障排查形成的临时数据导出文件，应在任务结束后五个工作日内归档至甲方批准的项目空间或按流程安全删除。”保留第 9.2 条原文及其脚注锚点。

  6. 批注：对正文第 10.2 条第一句“双方应保证本合同首页所列通讯地址、电子邮箱和联系电话真实有效。”添加 Word 批注，批注内容为：“请确认通讯地址、个人邮箱或联系电话变更时的书面通知及收悉记录均可追溯。”不要替换该句，也不要移动批注锚点。

  所有正文和表格内容的删除/替换/新增都保留为 Word 修订，不要接受或拒绝现有或新增修订。保留原有批注、脚注及其锚点、外部法律链接、内部书签导航、页眉页脚、页码字段、表格结构/合并单元格/重复表头、签署栏及附件顺序。保持原有视觉风格；允许内容变化导致合理分页，但不得有裁切、重叠、不可读或空白尾页。只交付 DOCX。
expected_effects:
  - 正文第 2.1、2.2 条中的期限及试用期日期彼此一致；培养回顾仍为三个月，不被误当成试用期修改。
  - 岗位、部门仅在第 3.1 条及附件 B 对应字段同步变更；其他人员、职级、职责和汇报关系保持原样。
  - 常规工作地点仅在第 4.1 条及附件 B 对应字段同步变更；旧地址作为注册地址或应急集合点的用途不被误改。
  - 基本工资为 20,800 元，大写准确；试用期工资为 16,640 元且等于基本工资的 80%；正文与附件 A 一致。
  - 800 元交通津贴以及两个 18,800 元年度参考金额仍各自保留，性质没有混淆。
  - 新信息安全句紧接第 9.2 条之后；第 9.2 条原有脚注仍在原锚点有效。
  - 新批注文字准确并锚定第 10.2 条指定首句；原有批注和所有超链接、书签、字段及重复表头仍有效。
  - 指定变更保留为可查看的修订；签署页、附件、表格完整且渲染清晰，无意外空白页。
invariants:
  - 不增删合同双方身份、证件号码、合同期限以外的日期、约定或法律结论。
  - 试用期为三个月，正文日期为 2026 年 11 月 1 日至 2027 年 1 月 31 日；附件 B.2.1 的三个月培养回顾保持不变。
  - 只将合同约定的常规办公地点改为龙井路地址；注册地址、应急集合点、设备交接地点和设备编号保持不变。
  - 月基本工资 20,800 元，中文大写为贰万零捌佰元整；试用期工资 16,640 元；计算比例为 80%。
  - 交通津贴 800 元/月、年度目标奖金参考额 18,800 元/年、培训预算参考上限 18,800 元/年均不得改动或混同。
  - 保留附件中的原有薪酬、岗位、部门和地点表格结构及其对应说明；不得改写未点名的其他条款。
  - 源有批注、脚注、外部法律链接、内部书签、页眉页脚和页码字段不得丢失或错锚；新增批注锚定第 10.2 条指定句。
  - 所有批准的插入、删除和替换均保留为修订，不接受或拒绝修订；不新增提示词之外的事实。
